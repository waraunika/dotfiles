[mgr]
cwd = { fg = "#abc7ff" }
find_keyword  = { fg = "#ddbce0", bold = true }
find_position = { fg = "#bec6dc", bg = "reset", bold = true }
marker_copied   = { fg = "#ddbce0", bg = "#ddbce0" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#abc7ff", bg = "#abc7ff" }
marker_selected = { fg = "#bec6dc", bg = "#bec6dc" }
count_copied   = { fg = "#3f2844", bg = "#ddbce0" }
border_symbol = "│"
border_style  = { fg = "#8e9099" }
syntect_theme = "~/.config/yazi/tm-themes/Monokai Dark Soda.tmTheme"

[indicator]
parent = { fg = "#bec6dc", bg="#1240a1"}
current = { fg = "#ccddff", bg="#1f6fe0", bold = true}

[tab]
active   = { fg = "#abc7ff", bg = "#0d2f5f" }
inactive = { fg = "#bec6dc", bg = "#283041" }

[mode]
normal_main = { fg = "#0d2f5f", bg = "#0055ff", bold = true }
normal_alt  = { fg = "#abc7ff", bg = "#727a8d" }

select_main = { fg = "#283041", bg = "#bec6dc", bold = true }
select_alt  = { fg = "#bec6dc", bg = "#1e2025" }

unset_main = { fg = "#3f2844", bg = "#ddbce0", bold = true }
unset_alt  = { fg = "#ddbce0", bg = "#1e2025" }

[status]

# Status bar background
bg = { bg = "#111318" }

# Individual status elements - these control the bottom bar text
style      = { fg = "#0044cc" }
size_style      = { fg = "#e2e2e9" }
date_style      = { fg = "#c4c6d0" }
sels_style      = { fg = "#abc7ff" }
separator_style = { fg = "#8e9099" }

progress_label  = { bold = true }
progress_normal = { fg = "#abc7ff", bg = "#111318" }
progress_error  = { fg = "#ffb4ab", bg = "#111318" }


count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#283041", bg = "#bec6dc" }

hovered         = { fg = "#d7e2ff", bg = "#294677" }
preview_hovered = { underline = true }
[input]
border   = { fg = "#abc7ff" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#abc7ff" }
active   = { fg = "#ddbce0" }
inactive = {}

[tasks]
border  = { fg = "#abc7ff" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#111318" }
cand            = { fg = "#ddbce0" }
rest            = { fg = "#8e9099" }
desc            = { fg = "#abc7ff" }
separator_style = { fg = "#8e9099" }

[help]
on      = { fg = "#ddbce0" }
run     = { fg = "#bec6dc" }
desc    = { fg = "#e2e2e9" }
hovered = { bg = "#1e2025", bold = true }
footer  = { fg = "#e2e2e9", bg = "#111318" }

[filetype]
rules = [
  { mime = "image/*", fg = "#ddbce0" },
  { mime = "video/*", fg = "#abc7ff" },
  { mime = "audio/*", fg = "#bec6dc" },
  { mime = "application/zip", fg = "#ffb4ab" },
  { mime = "application/gzip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip", fg = "#ffb4ab" },
  { mime = "application/x-bzip2", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },
]
