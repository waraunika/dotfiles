[mgr]
cwd = { fg = "#92cef5" }
find_keyword  = { fg = "#ccc1e9", bold = true }
find_position = { fg = "#b6c9d8", bg = "reset", bold = true }
marker_copied   = { fg = "#ccc1e9", bg = "#ccc1e9" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#92cef5", bg = "#92cef5" }
marker_selected = { fg = "#b6c9d8", bg = "#b6c9d8" }
count_copied   = { fg = "#332c4b", bg = "#ccc1e9" }
border_symbol = "│"
border_style  = { fg = "#8b9198" }
syntect_theme = "~/.config/yazi/tm-themes/Monokai Dark Soda.tmTheme"

[indicator]
parent = { fg = "#b6c9d8", bg="#21323e"}
current = { fg = "#92cef5", bg="#00344b", bold = true}

[tab]
active   = { fg = "#92cef5", bg = "#00344b" }
inactive = { fg = "#b6c9d8", bg = "#21323e" }

[mode]
normal_main = { fg = "#00344b", bg = "#92cef5", bold = true }
normal_alt  = { fg = "#92cef5", bg = "#1c2024" }

select_main = { fg = "#21323e", bg = "#b6c9d8", bold = true }
select_alt  = { fg = "#b6c9d8", bg = "#1c2024" }

unset_main = { fg = "#332c4b", bg = "#ccc1e9", bold = true }
unset_alt  = { fg = "#ccc1e9", bg = "#1c2024" }

[status]

# Status bar background
bg = { bg = "#0f1417" }

# Individual status elements - these control the bottom bar text
style      = { fg = "#92cef5" }
size_style      = { fg = "#dfe3e7" }
date_style      = { fg = "#c1c7ce" }
sels_style      = { fg = "#92cef5" }
separator_style = { fg = "#8b9198" }

progress_label  = { bold = true }
progress_normal = { fg = "#92cef5", bg = "#0f1417" }
progress_error  = { fg = "#ffb4ab", bg = "#0f1417" }


count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#21323e", bg = "#b6c9d8" }

hovered         = { fg = "#c6e7ff", bg = "#004c6b" }
preview_hovered = { underline = true }
[input]
border   = { fg = "#92cef5" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#92cef5" }
active   = { fg = "#ccc1e9" }
inactive = {}

[tasks]
border  = { fg = "#92cef5" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#0f1417" }
cand            = { fg = "#ccc1e9" }
rest            = { fg = "#8b9198" }
desc            = { fg = "#92cef5" }
separator_style = { fg = "#8b9198" }

[help]
on      = { fg = "#ccc1e9" }
run     = { fg = "#b6c9d8" }
desc    = { fg = "#dfe3e7" }
hovered = { bg = "#1c2024", bold = true }
footer  = { fg = "#dfe3e7", bg = "#0f1417" }

[filetype]
rules = [
  { mime = "image/*", fg = "#ccc1e9" },
  { mime = "video/*", fg = "#92cef5" },
  { mime = "audio/*", fg = "#b6c9d8" },
  { mime = "application/zip", fg = "#ffb4ab" },
  { mime = "application/gzip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip", fg = "#ffb4ab" },
  { mime = "application/x-bzip2", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },
]
