[mgr]
cwd = { fg = "#95d5a7" }
find_keyword  = { fg = "#a2cdda", bold = true }
find_position = { fg = "#b6ccb9", bg = "reset", bold = true }
marker_copied   = { fg = "#a2cdda", bg = "#a2cdda" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#95d5a7", bg = "#95d5a7" }
marker_selected = { fg = "#b6ccb9", bg = "#b6ccb9" }
count_copied   = { fg = "#023640", bg = "#a2cdda" }
border_symbol = "│"
border_style  = { fg = "#8b938a" }
syntect_theme = "~/.config/yazi/tm-themes/Monokai Dark Soda.tmTheme"

[indicator]
parent = { fg = "#b6ccb9", bg="#12a137"}
current = { fg = "#daf1e1", bg="#00994e", bold = true}

[tab]
active   = { fg = "#95d5a7", bg = "#00391d" }
inactive = { fg = "#b6ccb9", bg = "#223527" }

[mode]
normal_main = { fg = "#00391d", bg = "#48b767", bold = true }
normal_alt  = { fg = "#95d5a7", bg = "#758a75" }

select_main = { fg = "#223527", bg = "#b6ccb9", bold = true }
select_alt  = { fg = "#b6ccb9", bg = "#1c211c" }

unset_main = { fg = "#023640", bg = "#a2cdda", bold = true }
unset_alt  = { fg = "#a2cdda", bg = "#1c211c" }

[status]

# Status bar background
bg = { bg = "#101510" }

# Individual status elements - these control the bottom bar text
style      = { fg = "#3a9253" }
size_style      = { fg = "#dfe4dd" }
date_style      = { fg = "#c0c9bf" }
sels_style      = { fg = "#95d5a7" }
separator_style = { fg = "#8b938a" }

progress_label  = { bold = true }
progress_normal = { fg = "#95d5a7", bg = "#101510" }
progress_error  = { fg = "#ffb4ab", bg = "#101510" }


count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#223527", bg = "#b6ccb9" }

hovered         = { fg = "#b1f1c2", bg = "#11512e" }
preview_hovered = { underline = true }
[input]
border   = { fg = "#95d5a7" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#95d5a7" }
active   = { fg = "#a2cdda" }
inactive = {}

[tasks]
border  = { fg = "#95d5a7" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#101510" }
cand            = { fg = "#a2cdda" }
rest            = { fg = "#8b938a" }
desc            = { fg = "#95d5a7" }
separator_style = { fg = "#8b938a" }

[help]
on      = { fg = "#a2cdda" }
run     = { fg = "#b6ccb9" }
desc    = { fg = "#dfe4dd" }
hovered = { bg = "#1c211c", bold = true }
footer  = { fg = "#dfe4dd", bg = "#101510" }

[filetype]
rules = [
  { mime = "image/*", fg = "#a2cdda" },
  { mime = "video/*", fg = "#95d5a7" },
  { mime = "audio/*", fg = "#b6ccb9" },
  { mime = "application/zip", fg = "#ffb4ab" },
  { mime = "application/gzip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip", fg = "#ffb4ab" },
  { mime = "application/x-bzip2", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },
]
