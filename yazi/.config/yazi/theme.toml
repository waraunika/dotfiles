[mgr]
cwd = { fg = "#ffb4a2" }

hovered         = { fg = "#ffdbd2", bg = "#723524" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#dac58d", bold = true }
find_position = { fg = "#e7bdb3", bg = "reset", bold = true }

marker_copied   = { fg = "#dac58d", bg = "#dac58d" }
marker_cut      = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked   = { fg = "#ffb4a2", bg = "#ffb4a2" }
marker_selected = { fg = "#e7bdb3", bg = "#e7bdb3" }

tab_active   = { fg = "#561f11", bg = "#ffb4a2" }
tab_inactive = { fg = "#f1dfda", bg = "#271d1b" }
tab_width    = 1

count_copied   = { fg = "#3b2f04", bg = "#dac58d" }
count_cut      = { fg = "#690005", bg = "#ffb4ab" }
count_selected = { fg = "#442a23", bg = "#e7bdb3" }

border_symbol = "│"
border_style  = { fg = "#a08c88" }

syntect_theme = ""

[status]
separator_open  = ""
separator_close = ""

# Status bar background
bg = { bg = "#1a110f" }

# Individual status elements - these control the bottom bar text
mode_style      = { fg = "#ffb4a2" }
perm_style      = { fg = "#d8c2bc" }
size_style      = { fg = "#f1dfda" }
date_style      = { fg = "#d8c2bc" }
sels_style      = { fg = "#ffb4a2" }
separator_style = { fg = "#a08c88" }

progress_label  = { bold = true }
progress_normal = { fg = "#ffb4a2", bg = "#1a110f" }
progress_error  = { fg = "#ffb4ab", bg = "#1a110f" }

mode_normal_main = { fg = "#561f11", bg = "#ffb4a2", bold = true }
mode_normal_alt  = { fg = "#ffb4a2", bg = "#271d1b" }

mode_select_main = { fg = "#442a23", bg = "#e7bdb3", bold = true }
mode_select_alt  = { fg = "#e7bdb3", bg = "#271d1b" }

mode_unset_main = { fg = "#3b2f04", bg = "#dac58d", bold = true }
mode_unset_alt  = { fg = "#dac58d", bg = "#271d1b" }

[input]
border   = { fg = "#ffb4a2" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#ffb4a2" }
active   = { fg = "#dac58d" }
inactive = {}

[tasks]
border  = { fg = "#ffb4a2" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#1a110f" }
cand            = { fg = "#dac58d" }
rest            = { fg = "#a08c88" }
desc            = { fg = "#ffb4a2" }
separator       = "  "
separator_style = { fg = "#a08c88" }

[help]
on      = { fg = "#dac58d" }
run     = { fg = "#e7bdb3" }
desc    = { fg = "#f1dfda" }
hovered = { bg = "#271d1b", bold = true }
footer  = { fg = "#f1dfda", bg = "#1a110f" }

[filetype]
rules = [
  { mime = "image/*", fg = "#dac58d" },
  { mime = "video/*", fg = "#ffb4a2" },
  { mime = "audio/*", fg = "#e7bdb3" },
  { mime = "application/zip", fg = "#ffb4ab" },
  { mime = "application/gzip", fg = "#ffb4ab" },
  { mime = "application/x-tar", fg = "#ffb4ab" },
  { mime = "application/x-bzip", fg = "#ffb4ab" },
  { mime = "application/x-bzip2", fg = "#ffb4ab" },
  { mime = "application/x-7z-compressed", fg = "#ffb4ab" },
  { mime = "application/x-rar", fg = "#ffb4ab" },
]

