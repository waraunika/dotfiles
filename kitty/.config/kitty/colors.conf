## Kitty color scheme — generated by matugen. Do not edit directly;
## edit ~/.config/matugen/templates/kitty-colors.conf instead.

foreground              #dee4df
background              #0f1512
selection_foreground    #cee9dd
selection_background    #344c43
cursor                  #88d6bb
cursor_text_color       #00382b

url_color               #88d6bb

active_border_color     #88d6bb
inactive_border_color   #89938e

active_tab_foreground   #a3f2d6
active_tab_background   #00513f
inactive_tab_foreground #bfc9c3
inactive_tab_background #1b211e
tab_bar_background      #0f1512

# The 16 ANSI colors. p10k and most CLI tools reference these by index (0-15),
# so re-theming this file re-themes p10k's palette-index-based colors too.

# black
color0  #090f0d
color8  #89938e

# red
color1  #93000a
color9  #ffb4ab

# green (matugen has no dedicated "green" role — tertiary tends to land green-ish
# for cool source colors; swap to secondary if yours skews differently)
color2  #a8cbe2
color10 #c4e8fe

# yellow
color3  #93bdd2
color11 #c4e8fe

# blue
color4  #369c78
color12 #a3f2d6

# magenta
color5  #b2ccc1
color13 #cee9dd

# cyan
color6  #28d7ab
color14 #41be93

# white
color7  #dee4df
color15 #303633
