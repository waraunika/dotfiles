## Kitty color scheme — generated by matugen. Do not edit directly;
## edit ~/.config/matugen/templates/kitty-colors.conf instead.

foreground              #dfe4dd
background              #101510
selection_foreground    #d2e8d4
selection_background    #384b3c
cursor                  #95d5a7
cursor_text_color       #00391d

url_color               #95d5a7

active_border_color     #95d5a7
inactive_border_color   #8b938a

active_tab_foreground   #b1f1c2
active_tab_background   #11512e
inactive_tab_foreground #c0c9bf
inactive_tab_background #1c211c
tab_bar_background      #101510

# The 16 ANSI colors. p10k and most CLI tools reference these by index (0-15),
# so re-theming this file re-themes p10k's palette-index-based colors too.

# black
color0  #0a0f0b
color8  #8b938a

# red
color1  #93000a
color9  #ffb4ab

# green (matugen has no dedicated "green" role — tertiary tends to land green-ish
# for cool source colors; swap to secondary if yours skews differently)
color2  #a2cdda
color10 #beeaf7

# yellow
color3  #90c7d5
color11 #beeaf7

# blue
color4  #3b9655
color12 #b1f1c2

# magenta
color5  #b6ccb9
color13 #d2e8d4

# cyan
color6  #4cb373
color14 #48b767

# white
color7  #dfe4dd
color15 #dfe4dd 
