## Kitty color scheme — generated by matugen. Do not edit directly;
## edit ~/.config/matugen/templates/kitty-colors.conf instead.

foreground              #f1dedc
background              #1a1110
selection_foreground    #ffdad6
selection_background    #5d3f3c
cursor                  #ffb3ac
cursor_text_color       #571e1a

url_color               #ffb3ac

active_border_color     #ffb3ac
inactive_border_color   #a08c8a

active_tab_foreground   #ffdad6
active_tab_background   #73332f
inactive_tab_foreground #d8c2bf
inactive_tab_background #271d1c
tab_bar_background      #1a1110

# The 16 ANSI colors. p10k and most CLI tools reference these by index (0-15),
# so re-theming this file re-themes p10k's palette-index-based colors too.

# black
color0  #140c0b
color8  #a08c8a

# red
color1  #ffb4ab
color9  #93000a

# green (matugen has no dedicated "green" role — tertiary tends to land green-ish
# for cool source colors; swap to secondary if yours skews differently)
color2  #e1c38c
color10 #fedea6

# yellow
color3  #ddc288
color11 #fedea6

# blue
color4  #ff786b
color12 #ffdad6

# magenta
color5  #e7bdb8
color13 #ffdad6

# cyan
color6  #ac5953
color14 #ff1600

# white
color7  #f1dedc
color15 #3d3231
