## Kitty color scheme — generated by matugen. Do not edit directly;
## edit ~/.config/matugen/templates/kitty-colors.conf instead.

foreground              #e2e2e9
background              #111318
selection_foreground    #dae2f9
selection_background    #3e4759
cursor                  #abc7ff
cursor_text_color       #0d2f5f

url_color               #abc7ff

active_border_color     #abc7ff
inactive_border_color   #8e9099

active_tab_foreground   #d7e2ff
active_tab_background   #294677
inactive_tab_foreground #c4c6d0
inactive_tab_background #1e2025
tab_bar_background      #111318

# The 16 ANSI colors. p10k and most CLI tools reference these by index (0-15),
# so re-theming this file re-themes p10k's palette-index-based colors too.

# black
color0  #0c0e13
color8  #8e9099

# red
color1  #93000a
color9  #ffb4ab

# green (matugen has no dedicated "green" role — tertiary tends to land green-ish
# for cool source colors; swap to secondary if yours skews differently)
color2  #ddbce0
color10 #fad8fc

# yellow
color3  #bda4c1
color11 #fad8fc

# blue
color4  #6b9cff
color12 #d7e2ff

# magenta
color5  #bec6dc
color13 #dae2f9

# cyan
color6  #5072af
color14 #0055ff

# white
color7  #e2e2e9
color15 #33353a
