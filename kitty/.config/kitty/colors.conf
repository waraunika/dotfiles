## Kitty color scheme — generated by matugen. Do not edit directly;
## edit ~/.config/matugen/templates/kitty-colors.conf instead.

foreground              #dfe3e7
background              #0f1417
selection_foreground    #d2e5f4
selection_background    #374955
cursor                  #92cef5
cursor_text_color       #00344b

url_color               #92cef5

active_border_color     #92cef5
inactive_border_color   #8b9198

active_tab_foreground   #c6e7ff
active_tab_background   #004c6b
inactive_tab_foreground #c1c7ce
inactive_tab_background #1c2024
tab_bar_background      #0f1417

# The 16 ANSI colors. p10k and most CLI tools reference these by index (0-15),
# so re-theming this file re-themes p10k's palette-index-based colors too.

# black
color0  #0a0f12
color8  #8b9198

# red
color1  #93000a
color9  #ffb4ab

# green (matugen has no dedicated "green" role — tertiary tends to land green-ish
# for cool source colors; swap to secondary if yours skews differently)
color2  #ccc1e9
color10 #e8ddff

# yellow
color3  #4a4263
color11 #e8ddff

# blue
color4  #92cef5
color12 #c6e7ff

# magenta
color5  #b6c9d8
color13 #d2e5f4

# cyan
color6  #206487
color14 #92cef5

# white
color7  #dfe3e7
color15 #dfe3e7 
