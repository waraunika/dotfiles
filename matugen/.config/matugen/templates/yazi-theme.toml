[mgr]
cwd = { fg = "{{colors.primary.dark.hex}}" }

hovered         = { fg = "{{colors.on_primary_container.dark.hex}}", bg = "{{colors.primary_container.dark.hex}}" }
preview_hovered = { underline = true }

find_keyword  = { fg = "{{colors.tertiary.dark.hex}}", bold = true }
find_position = { fg = "{{colors.secondary.dark.hex}}", bg = "reset", bold = true }

marker_copied   = { fg = "{{colors.tertiary.dark.hex}}", bg = "{{colors.tertiary.dark.hex}}" }
marker_cut      = { fg = "{{colors.error.dark.hex}}", bg = "{{colors.error.dark.hex}}" }
marker_marked   = { fg = "{{colors.primary.dark.hex}}", bg = "{{colors.primary.dark.hex}}" }
marker_selected = { fg = "{{colors.secondary.dark.hex}}", bg = "{{colors.secondary.dark.hex}}" }

tab_active   = { fg = "{{colors.on_primary.dark.hex}}", bg = "{{colors.primary.dark.hex}}" }
tab_inactive = { fg = "{{colors.on_surface.dark.hex}}", bg = "{{colors.surface_container.dark.hex}}" }
tab_width    = 1

count_copied   = { fg = "{{colors.on_tertiary.dark.hex}}", bg = "{{colors.tertiary.dark.hex}}" }
count_cut      = { fg = "{{colors.on_error.dark.hex}}", bg = "{{colors.error.dark.hex}}" }
count_selected = { fg = "{{colors.on_secondary.dark.hex}}", bg = "{{colors.secondary.dark.hex}}" }

border_symbol = "│"
border_style  = { fg = "{{colors.outline.dark.hex}}" }

syntect_theme = ""

[status]
separator_open  = ""
separator_close = ""

# Status bar background
bg = { bg = "{{colors.surface.dark.hex}}" }

# Individual status elements - these control the bottom bar text
mode_style      = { fg = "{{colors.primary.dark.hex}}" }
perm_style      = { fg = "{{colors.on_surface_variant.dark.hex}}" }
size_style      = { fg = "{{colors.on_surface.dark.hex}}" }
date_style      = { fg = "{{colors.on_surface_variant.dark.hex}}" }
sels_style      = { fg = "{{colors.primary.dark.hex}}" }
separator_style = { fg = "{{colors.outline.dark.hex}}" }

progress_label  = { bold = true }
progress_normal = { fg = "{{colors.primary.dark.hex}}", bg = "{{colors.surface.dark.hex}}" }
progress_error  = { fg = "{{colors.error.dark.hex}}", bg = "{{colors.surface.dark.hex}}" }

mode_normal_main = { fg = "{{colors.on_primary.dark.hex}}", bg = "{{colors.primary.dark.hex}}", bold = true }
mode_normal_alt  = { fg = "{{colors.primary.dark.hex}}", bg = "{{colors.surface_container.dark.hex}}" }

mode_select_main = { fg = "{{colors.on_secondary.dark.hex}}", bg = "{{colors.secondary.dark.hex}}", bold = true }
mode_select_alt  = { fg = "{{colors.secondary.dark.hex}}", bg = "{{colors.surface_container.dark.hex}}" }

mode_unset_main = { fg = "{{colors.on_tertiary.dark.hex}}", bg = "{{colors.tertiary.dark.hex}}", bold = true }
mode_unset_alt  = { fg = "{{colors.tertiary.dark.hex}}", bg = "{{colors.surface_container.dark.hex}}" }

[input]
border   = { fg = "{{colors.primary.dark.hex}}" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "{{colors.primary.dark.hex}}" }
active   = { fg = "{{colors.tertiary.dark.hex}}" }
inactive = {}

[tasks]
border  = { fg = "{{colors.primary.dark.hex}}" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "{{colors.surface.dark.hex}}" }
cand            = { fg = "{{colors.tertiary.dark.hex}}" }
rest            = { fg = "{{colors.outline.dark.hex}}" }
desc            = { fg = "{{colors.primary.dark.hex}}" }
separator       = "  "
separator_style = { fg = "{{colors.outline.dark.hex}}" }

[help]
on      = { fg = "{{colors.tertiary.dark.hex}}" }
run     = { fg = "{{colors.secondary.dark.hex}}" }
desc    = { fg = "{{colors.on_surface.dark.hex}}" }
hovered = { bg = "{{colors.surface_container.dark.hex}}", bold = true }
footer  = { fg = "{{colors.on_surface.dark.hex}}", bg = "{{colors.surface.dark.hex}}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{colors.tertiary.dark.hex}}" },
  { mime = "video/*", fg = "{{colors.primary.dark.hex}}" },
  { mime = "audio/*", fg = "{{colors.secondary.dark.hex}}" },
  { mime = "application/zip", fg = "{{colors.error.dark.hex}}" },
  { mime = "application/gzip", fg = "{{colors.error.dark.hex}}" },
  { mime = "application/x-tar", fg = "{{colors.error.dark.hex}}" },
  { mime = "application/x-bzip", fg = "{{colors.error.dark.hex}}" },
  { mime = "application/x-bzip2", fg = "{{colors.error.dark.hex}}" },
  { mime = "application/x-7z-compressed", fg = "{{colors.error.dark.hex}}" },
  { mime = "application/x-rar", fg = "{{colors.error.dark.hex}}" },
]

