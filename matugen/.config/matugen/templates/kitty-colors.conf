## Kitty color scheme — generated by matugen. Do not edit directly;
## edit ~/.config/matugen/templates/kitty-colors.conf instead.

foreground              {{colors.on_background.dark.hex}}
background              {{colors.background.dark.hex}}
selection_foreground    {{colors.on_secondary_container.dark.hex}}
selection_background    {{colors.secondary_container.dark.hex}}
cursor                  {{colors.primary.dark.hex}}
cursor_text_color       {{colors.on_primary.dark.hex}}

url_color               {{colors.primary.dark.hex}}

active_border_color     {{colors.primary.dark.hex}}
inactive_border_color   {{colors.outline.dark.hex}}

active_tab_foreground   {{colors.on_primary_container.dark.hex}}
active_tab_background   {{colors.primary_container.dark.hex}}
inactive_tab_foreground {{colors.on_surface_variant.dark.hex}}
inactive_tab_background {{colors.surface_container.dark.hex}}
tab_bar_background      {{colors.surface.dark.hex}}

# The 16 ANSI colors. p10k and most CLI tools reference these by index (0-15),
# so re-theming this file re-themes p10k's palette-index-based colors too.

# black
color0  {{colors.surface_container_lowest.dark.hex}}
color8  {{colors.outline.dark.hex}}

# red
color1  {{colors.error.dark.hex}}
color9  {{colors.error_container.dark.hex}}

# green (matugen has no dedicated "green" role — tertiary tends to land green-ish
# for cool source colors; swap to secondary if yours skews differently)
color2  {{colors.tertiary.dark.hex}}
color10 {{colors.tertiary_fixed.dark.hex}}

# yellow
color3  {{colors.tertiary_container.dark.hex | set_lightness: 70}}
color11 {{colors.on_tertiary_container.dark.hex}}

# blue
color4  {{colors.primary.dark.hex | set_lightness: 71}}
color12 {{colors.primary_fixed.dark.hex}}

# magenta
color5  {{colors.secondary.dark.hex}}
color13 {{colors.secondary_fixed.dark.hex}}

# cyan
color6  {{colors.inverse_primary.dark.hex | set_lightness: 50}}
color14 {{colors.primary_fixed_dim.dark.hex | set_lightness: 50}}

# white
color7  {{colors.on_surface.dark.hex}}
color15 {{colors.surface_container_highest.dark.hex}}
