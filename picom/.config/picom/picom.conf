backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
unredir-if-possible = true;

corner-radius = 10;
rounded-corners-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
	"class_g = 'slop'"
];

blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"_GTK_FRAME_EXTENTS@:c",
	"class_g = 'slop'",
	"name = 'slop'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
	"window_type = 'dock'",
	"_GTK_FRAME_EXTENTS@:c",
	"class_g = 'slop'"
];

inactive-opacity = 0.85;
frame-opacity = 0.9;
detect-client-opacity = true;

wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.95; focus = true; full-shadow = false; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
};
