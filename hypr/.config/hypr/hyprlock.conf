source = colors.conf

general {
	hide_cursor = false
	ignore_empty_input = true
	immediate_render = true
	text_trim = true
	fractional_scaling = 1
	screencopy_mode = 0
	fail_timeout = 200
}

background {
	monitor = 
	path = screenshot
  color = rgba(25, 20, 20, 1.0)
  blur_passes = 2
}

animation {
	enabled = false
}

label {
	monitor = 
	text = cmd[update:1000] echo -e "$(date +%A)"
	color = $on_primary
	font_size = 80
	font_family = GeistMono Nerd Font Propo Bold
	position = 0, 450
	halign = center
	valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgba(244, 244, 244, 0.9)
    font_size = 40
    font_family = GeistMono Nerd Font Bold
    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M:%S")</span>"
    color = rgba(255, 255, 255, 1)
    font_size = 70
    font_family = GeistMono Nerd Font Propo Light
    position = 0, 250
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/Pictures/lockscreen/cat.png
    border_size = 0
    border_color = rgba(178, 84, 96, 1)
    size = 215
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 300, 60
    color = rgba(255, 255, 255, .1)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.5)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -230
    halign = center
    valign = center
}

label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = SF Pro Display Bold
    position = 0, -230
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = :w
		GeistMono Nerd Font Propo
    placeholder_text = <span foreground="##ffffff99"><b></b>   Enter Password</span>
    hide_input = false
    position = 0, -310
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = rgba(255, 255, 255, 0.6)
		font_family = GeistMono Nerd Font Propo
    font_size = 40
    onclick = reboot now
    position = 0, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰐥
    color = rgba(255, 255, 255, 0.6)
    font_size = 40
		font_family = GeistMono Nerd Font Propo
    onclick = shutdown now
    position = 820, 80
    halign = left 
    valign = bottom
}

label {
    monitor =
    text = 󰤄
    color = rgba(255, 255, 255, 0.6)
    font_size = 40
    onclick = systemctl suspend
    position = -820, 80
    halign = right
    valign = bottom
}
